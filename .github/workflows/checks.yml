name: Checks

# Runs on every pull request and on main, so a broken change is seen before it is merged.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      # fails when a model changed without its migration, which is how a live database falls behind
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    name: Site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
